<!DOCTYPE html>
 
<html lang="en">
    <head>
        <title>Hotel Room Booking Form</title>
    </head>
    <body bgcolor="lavender">
      <table border="5" width="500"
      height="400" align="center" bgcolor="white">

      <th>
        <tr>
            <th colspan="2" align="center" bgcolor="lightblue">
            <h1 align="center">Hotel Room Booking Form</h1>
            <form action="#" method="post" align="center">
        </form>
        </th>
        </tr>
     </th>
<tbody>
    <tr>
       <th><label for="fullname">Full Name:</label></th>
      <td><input type="text" id="fullname" name="fullname" required size="30"></td>
    </tr>
         
     <tr>
        <th><label for="email">Email:</label></th>
       <td><input type="email" id="email" name="email" required size="30"></td>
       </tr>

        <tr>
      <th><label for="Phone">Phone:</label></th>
      <td><input type="tel" id="phone" name="phone" required size="30"></td>
        </tr>

        <tr>
      <th><label for="Checkin">Check-in-Date:</label></th>
        <td><input type="date" id="checkin" name="checkin" required></td>
       </tr>

       <tr>
       <th><label for="checkout">Check-out-Date:</label></th>
       <td><input type="date" id="checkout" name="checkout" required></td>
        </tr>

<tr>
    <th><label for="Room Type">Room Type:</label></th>
    <td><select>
        <option>Single Room</option>
        <option>Double Room</option>
        <option>Deluxe Room</option>
        <option>Suite</option>
    </select>
</td>
</tr>

<tr>
    <th>Total Guest:</th>
    <td><input type="number" min="1"></td>
</tr>

<tr>
    <th>Special Guest:</th>
    <td><textarea rows="4" placeholder="Any extra requiremnt"></textarea></td>
</tr>
<tr>
    <td colspan="2" align="center">
        <input type="checkbox" checked>I Agree to Terms & Conditons
    </td>
</tr>

<tr>
    <td colspan="2" align="center">
        <button type="submit"><b>Book Now</b></button>
        <button type="Reset"><b>Reset Form</b></button>
    </td> 
</tr>
</tbody>
</table>
     </form>
    </body>
</html>
