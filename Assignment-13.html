<html>
    <head>
        <title>Rowspan and Colspan(TimeTable)</title>
    </head>
    <body>

        <table border="1" cellpadding="8" cellspacing="0">
            <caption><b>Weekly TimeTable</b></caption>
            <thead>
                <tr>
                    <td><b>Day</b></td>
                    <td><b>9-10</b></td>
                    <td><b>10-11</b></td>
                    <td><b>11-12</b></td>
                </tr>    

                <tr>
                    <td>Mon</td>
                    <td>Maths</td>
                    <td>HTML</td>
                    <td rowspan="2">Web Lab</td>
                </tr>

                <tr>
                    <td>Tue</td>
                    <td>DBMS</td>
                    <td>OS</td>
                </tr>
            </thead>    
            <tfoot>
                <tr>
                    <td>Web</td>
                    <td colspan="3">Seminar</td>
                </tr>
            </tfoot>
        </table>
    </body>
</html>
