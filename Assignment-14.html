<html>
    <head>
        <title>Nested and Responsive Tables</title>
    </head>
    <body>
        <div class="table-container">
        <table border="1" cellpadding="8" cellspacing="0">
           <thead>
            <tr>
                <td>day</td>
                <td>Lab Batches</td>
                <td>Faculty</td>
                <td>Room</td>
                <td>Time</td>
            </tr>
           </thead> 
           <tbody>
                 <tr>
                    <td>Friday</td>
                    <td>
                        <table class="nested-table" border="1" cellpadding="4" cellspacing="0">
                            <thead>
                                <tr>
                                    <th>Batch</th>
                                    <th>System</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>A1</td>
                                    <td>PC 1-20</td>
                                </tr>
                                <tr>
                                    <td>A2</td>
                                    <td>PC 21-40</td>
                                </tr>
                            </tbody>
                        </table>
                    </td>
                    <td>Dr. Sharma</td>
                    <td>Lab 2</td>
                    <td>2-4 PM</td>
                 </tr>
           </tbody>
        </table>
        </div>
    </body>
</html>
