<!DOCTYPE html>
<html>
    <head>
        <title>Forms: Input elements, Labels and Fieldset</title>
    </head>
    <body>
        <form action="/submit-data" mathod="POST">
            <fieldset>
                <legend>Personal Details</legend>

                <label for="Username">Name:</label>
                <input type="text" id="Username" name="Username" required><br><br>

                <label for="Email">Email:</label>
                <input type="Email" id="Email" name="Email" placeholder="name@example.com" required><br><br>

                <label for="Password">Password:</label>
                <input type="password" id="Password" name="Password" minlength="8" required><br><br>

                <label for="Gender">Gender:</label>
                <input type="radio" id="male" name="Gender" value="male">
                <label for="male">Male</label>
                <input type="radio" id="female" name="Gender" value="female">
                <label for="female">Female</label><br><br>

                <label for="hobbies">Hobbies</label>
                <input type="checkbox" id="reading" name="hobbies" value="reading">
                <label for="reading">Reading</label>
                <input type="checkbox" id="coding" name="hobbies" value="coding">
                <label for="coding">Coding</label><br><br>

                <label for="dob">DOB:</label>
                <input type="text" id="dob" name="dob">

            </fieldset>
        </form>
    </body>
</html>
