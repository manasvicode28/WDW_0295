<!DOCTYPE html>
<html>
    <head>
        <title>ABC College Admission 2026</title>
    </head>
    <body>
        
        <table width="800" align="center" border="0" cellpadding="10" cellspacing="0">

            <tr>
                <td bgcolor="#1e3a8a" align="center">
                    <header>
                        <h1><font color="#ffffff">ABC College admission 2026</font></h1>
                    </header>

                </td>
            </tr>

            <tr>
                <td>
                    <main>
                        <section aria-labelledby="courses-heading">
                            <h2 id="courses-heading">Courses and Fees</h2>

                            <table border="1" width="100%" cellpadding="8" cellspacing="0">
                                <caption>Available Courses</caption>
                                <thead>
                                    <tr bgcolor="#d3d3d3">
                                        <th scope="col">Courses</th>
                                        <th scope="col">Seats</th>
                                        <th scope="col">Fees</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>B.Tech CSE</td>
                                        <td>120</td>
                                        <td>&#8377;90,000</td>
                                    </tr>
                                    <tr>
                                        <td>BCA</td>
                                        <td>60</td>
                                        <td>&#8377;45,000</td>
                                    </tr>
                                </tbody>
                            </table>
                        </section>

                        <br>

                        <section aria-label="Student Application">
                            <form action="#" method="post">
                                <fieldset>
                                    <legend>Application Form</legend>

                                    <p>
                                        <label for="student-name">Name:</label><br>
                                        <input type="text" id="student-name" name="name" size="40" required>
                                    </p>

                                    <p>
                                        <label for="student-email">Email:</label><br>
                                        <input type="email" id="student-email" name="email" size="40" required>
                                    </p>

                                    <p>
                                        <label for="course-select">Statement:</label><br>
                                        <select id="course-select" name="course" required>
                                            <option value="cse">CSE</option>
                                            <option value="bca">BCA</option>
                                            <option vlaue="mba">MBA</option>
                                            <option value="ai-ml">AI-ML</option>
                                            <option value="ds">DS</option>
                                        </select>
                                    </p>

                                    <p>
                                        <label for="statement">Statement:</label><br>
                                        <textarea id="statement" name="statement" rows="4" cols="65" required></textarea>
                                    </p>

                                    <p>
                                        <button type="submit">Apply</button>
                                    </p>
                                </fieldset>
                            </form>
                        </section>
                    </main>
                </td>
            </tr>

            <tr>
                <td bgcolor="#1e3a8a" align="center">
                    <footer>
                        <font color="#ffffff">&copy; 2026 ABC College</font>
                    </footer>
                </td>
            </tr>
        </table>

    </body>
</html>
