<!DOCTYPE html>
<html>
    <head>
        <title>
            Unordered,Ordered and Description lists
        </title>
    </head>
    <body>
        <p>
        <h1>Unordered</h1>
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
            </ul>
        
       <h1>Ordered</h1>
            <ol>
                <li>Install VS Code</li>
                <li>Create file</li>
                <li>Open in browswer </li>
            </ol>

        <h1>Description</h1>
            <dl>
                <dt>HTML</dt>
                <dd>HyperText Markup Language</dd>

                <dt>CSS</dt>
                <dd>Cascading Style Sheets</dd>
            </dl>
        </p>
    </body>
</html>
