<!DOCTYPE hmtl>
<html>
    <head>
        <title>Multimedia: Image,Video, Audio and Youtube</title>
    </head>
    <body>
        <h3>Image</h3>
        <img src="College campus.jpg" alt="College Campus" width="200" height="200">
         
        <h3>Video</h3>
        <video width="320" height="240" controls>
        <source src="sample_video.mp4" type="video/mp4">
        Your browser does not support the video tag.
        </video>

        <h3>Audio</h3>
        <audio controls>
            <source src="sample_audio.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>

        <h3>Youtube</h3>
        <iframe width="300" height="200" src="https://youtube.com" title="Youtube Video" frameborder="0"></iframe>


    </body>
</html>
